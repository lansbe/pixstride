name: Load frozen images
description: Load the source corpus and the verified, untimed reference renders
inputs:
  arch: {required: true, description: Native runner architecture}
  token: {required: true, description: Read-only artifact access}
runs:
  using: composite
  steps:
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
      with:
        name: benchmark-v2-shared-corpus
        path: ${{ runner.temp }}/corpus
        run-id: 44920819863
        github-token: ${{ inputs.token }}
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
      with:
        name: peer-reference-${{ inputs.arch }}
        path: ${{ runner.temp }}/pixels
        run-id: 45043123579
        github-token: ${{ inputs.token }}
    - shell: bash
      run: |
        python3 -m venv "$RUNNER_TEMP/env"
        "$RUNNER_TEMP/env/bin/pip" -q install --only-binary=:all: Pillow==13.0.0
