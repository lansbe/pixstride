name: PixStride native measurements
on:
  push:
    branches: [codex/benchmark-five-servers]
    paths:
      - 'benchmarks/pixstride-selection.json'
      - '.github/workflows/pixstride-only.yml'
permissions:
  contents: read
  actions: read
jobs:
  select:
    runs-on: ubuntu-24.04
    outputs:
      measure: ${{ steps.plan.outputs.measure }}
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false}
      - id: plan
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          plan = json.loads(Path('benchmarks/pixstride-selection.json').read_text())
          ranks = plan['ranks']
          assert ranks == 'all' or isinstance(ranks, list) and len(set(ranks)) == len(ranks) and all(type(i) is int and 1 <= i <= 1000 for i in ranks)
          lanes = plan['lanes']
          assert type(lanes) is int and 1 <= lanes <= 32
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              print('measure=' + str(bool(ranks)).lower(), file=out)
              print('matrix=' + json.dumps({'platform': [
                  {'arch': 'amd64', 'runner': 'ubuntu-24.04'},
                  {'arch': 'arm64', 'runner': 'ubuntu-24.04-arm'}], 'lane': list(range(lanes))}), file=out)
          PY
  build:
    needs: select
    name: Build on native ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {arch: amd64, runner: ubuntu-24.04}
          - {arch: arm64, runner: ubuntu-24.04-arm}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        env: {DOCKER_BUILD_RECORD_UPLOAD: 'false'}
        with:
          context: .
          target: ${{ needs.select.outputs.measure == 'true' && 'runtime' || 'codec-runtime-check' }}
          cache-from: type=gha,scope=pixstride-native-${{ matrix.arch }}
          cache-to: type=gha,scope=pixstride-native-${{ matrix.arch }},mode=max,ignore-error=true
          load: ${{ needs.select.outputs.measure == 'true' }}
          labels: org.opencontainers.image.revision=${{ github.sha }}
          tags: pixstride:candidate
      - if: needs.select.outputs.measure == 'true'
        run: |
          docker image inspect --format '{{.Id}}' pixstride:candidate > "$RUNNER_TEMP/image-id.txt"
          docker save pixstride:candidate | gzip -1 > "$RUNNER_TEMP/image.tar.gz"
      - if: needs.select.outputs.measure == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: pixstride-image-${{ matrix.arch }}
          path: |
            ${{ runner.temp }}/image-id.txt
            ${{ runner.temp }}/image.tar.gz
          compression-level: 0
          if-no-files-found: error
          retention-days: 7
  measure:
    needs: [select, build]
    if: needs.select.outputs.measure == 'true'
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix: ${{ fromJSON(needs.select.outputs.matrix) }}
    name: PixStride ${{ matrix.platform.arch }} lane ${{ matrix.lane }}
    runs-on: ${{ matrix.platform.runner }}
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false}
      - uses: ./.github/actions/peer-inputs
        with: {arch: '${{ matrix.platform.arch }}', token: '${{ github.token }}'}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with: {name: 'pixstride-image-${{ matrix.platform.arch }}', path: '${{ runner.temp }}/image'}
      - env: {LANE: '${{ matrix.lane }}'}
        run: |
          gzip -dc "$RUNNER_TEMP/image/image.tar.gz" | docker load
          "$RUNNER_TEMP/env/bin/python" scripts/benchmark_pixstride_only.py \
            --fixtures "$RUNNER_TEMP/corpus" --pixels "$RUNNER_TEMP/pixels" \
            --image "$(cat "$RUNNER_TEMP/image/image-id.txt")" --revision "$GITHUB_SHA" \
            --lane "$LANE" --output "$RUNNER_TEMP/samples.jsonl"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: pixstride-samples-${{ matrix.platform.arch }}-${{ matrix.lane }}
          path: ${{ runner.temp }}/samples.jsonl
          if-no-files-found: error
          retention-days: 90
