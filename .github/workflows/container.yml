name: Container
on:
  push:
    branches: [master, develop]
    tags: ['v*']
  pull_request:
    types: [opened, synchronize, reopened, edited, ready_for_review]
  workflow_dispatch:
permissions:
  contents: read
env:
  IMAGE: ghcr.io/lansbe/pixstride
concurrency:
  group: container-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}
jobs:
  documentation:
    name: Documentation
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check release tooling and documentation
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          set -euo pipefail
          python3 -m unittest discover -s .github/checks/project -v
          args=()
          if test -n "$PR_BASE"; then args+=(--base "$PR_BASE"); fi
          python3 scripts/project.py check "${args[@]}"
          python3 - <<'PY'
          import os, re
          title = os.environ.get('PR_TITLE', '')
          if os.environ.get('PR_BASE'):
              assert re.fullmatch(r'(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([a-zA-Z0-9_./-]+\))?!?: \S[^\r\n]*', title), 'Use a Conventional Commit PR title'
          PY
          git diff --check
  native-platforms:
    name: Native codecs (${{ matrix.runner }})
    needs: documentation
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install native dependencies and locked Rust toolchain
        run: |
          brew install vips pkgconf go
          rustup toolchain install 1.99.0 --profile minimal --component rustfmt,clippy
          rustup override set 1.99.0
          cargo fetch --locked
      - name: Check both engines and native interoperability
        run: |
          cargo fmt --check
          cargo clippy --all-targets --all-features --locked --offline -- -D warnings
          cargo test --locked --offline
          cargo test --all-features --locked --offline
          cargo build --all-features --locked --offline
          sh .github/checks/abi/run-abi-check.sh .
          python3 scripts/native_check.py --binary target/debug/pixstride
          python3 scripts/server_check.py --binary target/debug/pixstride
          python3 scripts/robustness.py --binary target/debug/pixstride
      - name: Build the pinned OSS reference and compare decoded pixels
        run: |
          ref=$(python3 -c 'import json; print(json.load(open(".github/checks/compatibility/reference.json"))["source_commit"])')
          git init "$RUNNER_TEMP/imgproxy"
          git -C "$RUNNER_TEMP/imgproxy" remote add origin https://github.com/imgproxy/imgproxy.git
          git -C "$RUNNER_TEMP/imgproxy" fetch --depth=1 origin "$ref"
          git -C "$RUNNER_TEMP/imgproxy" checkout --detach FETCH_HEAD
          test "$(git -C "$RUNNER_TEMP/imgproxy" rev-parse HEAD)" = "$ref"
          (cd "$RUNNER_TEMP/imgproxy" && go build -o "$RUNNER_TEMP/imgproxy-reference" ./cli)
          python3 scripts/compatibility.py --binary target/debug/pixstride --reference-binary "$RUNNER_TEMP/imgproxy-reference" --report "$RUNNER_TEMP/compatibility.json"

  validate:
    needs: documentation
    if: github.event_name != 'push' || !startsWith(github.ref, 'refs/tags/')
    strategy:
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build
        run: docker build --pull -t pixstride:check .
      - name: Verify native runtime restrictions
        run: python3 scripts/container_check.py --image pixstride:check
      - name: Check module size and container dependencies
        run: |
          python3 -c "from pathlib import Path; oversized=[str(p) for p in Path('src').rglob('*.rs') if len(p.read_text().splitlines())>500]; assert not oversized, oversized"
          docker save pixstride:check -o "$RUNNER_TEMP/pixstride.tar"
          chmod 0444 "$RUNNER_TEMP/pixstride.tar"
          docker run --rm --cap-drop=ALL --security-opt=no-new-privileges --memory=1g --pids-limit=64 -v "$RUNNER_TEMP/pixstride.tar:/image.tar:ro" aquasec/trivy:0.76.2@sha256:8f6bb947dbc528902e11f2f5be52f7b519f6a39d5d148f41166f2040499768fb image --input /image.tar --scanners vuln,secret --severity HIGH,CRITICAL --exit-code 1 --no-progress
      - name: Verify locked-down startup and a synthetic image
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/images"
          printf '%s' '<svg width="64" height="48"><rect width="64" height="48" fill="#247ac0"/></svg>' > "$RUNNER_TEMP/images/sample.svg"
          docker run -d --name pixstride-check --read-only --cap-drop=ALL --security-opt=no-new-privileges --memory=512m --pids-limit=64 --cpus=2 -p 127.0.0.1:8080:8080 -v "$RUNNER_TEMP/images:/images:ro" -e PIXSTRIDE_ALLOW_UNSAFE=1 -e PIXSTRIDE_LOCAL_ROOT=/images -e PIXSTRIDE_ALLOWED_HOSTS=127.0.0.1 pixstride:check
          trap 'docker rm -f pixstride-check' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8080/health; then break; fi
            sleep 1
          done
          curl --fail --silent --show-error 'http://127.0.0.1:8080/unsafe/rs:fit:32:24/plain/local:///sample.svg@png' -o "$RUNNER_TEMP/output.png"
          python3 - "$RUNNER_TEMP/output.png" <<'PY'
          import struct,sys
          data=open(sys.argv[1],'rb').read()
          assert data[:8]==b'\x89PNG\r\n\x1a\n'
          assert struct.unpack('>II',data[16:24])==(32,24)
          PY
          test "$(curl -s -o /dev/null -w '%{http_code}' 'http://127.0.0.1:8080/unsafe/plain/http://127.0.0.1/image.png@png')" = 502
          if docker run --rm --network=none --read-only --cap-drop=ALL --security-opt=no-new-privileges --memory=128m --pids-limit=32 pixstride:check; then exit 1; fi
  # Untagged candidates are pushed by digest before validation. In a public
  # package they are publicly pullable. Release tags move only after all checks.
  build-and-verify:
    needs: documentation
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check release source and version
        shell: bash
        env:
          RELEASE_REF: ${{ github.ref_name }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          python3 scripts/project.py check --release-tag "$RELEASE_REF"
          python3 -c "from pathlib import Path; oversized=[str(p) for p in Path('src').rglob('*.rs') if len(p.read_text().splitlines())>500]; assert not oversized, oversized"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          version: v0.38.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and stage one architecture by digest
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          outputs: type=image,name=ghcr.io/lansbe/pixstride,push-by-digest=true,name-canonical=true,push=true,oci-mediatypes=true
          provenance: mode=max
          sbom: true
      - name: Resolve immutable platform and attestation manifests
        id: manifests
        shell: bash
        env:
          INDEX_DIGEST: ${{ steps.build.outputs.digest }}
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          [[ "$INDEX_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          docker buildx imagetools inspect --raw "$IMAGE@$INDEX_DIGEST" > "$RUNNER_TEMP/index.json"
          manifest=$(jq -er --arg arch "$ARCH" '
            [.manifests[] | select(.platform.os == "linux" and .platform.architecture == $arch) | .digest]
            | if length == 1 then .[0] else error("expected exactly one platform manifest") end
          ' "$RUNNER_TEMP/index.json")
          [[ "$manifest" =~ ^sha256:[0-9a-f]{64}$ ]]
          jq -e --arg manifest "$manifest" '
            [.manifests[] | select(.annotations["vnd.docker.reference.type"] == "attestation-manifest"
              and .annotations["vnd.docker.reference.digest"] == $manifest) | .digest]
            | if length > 0 then . else error("missing platform attestations") end
          ' "$RUNNER_TEMP/index.json" > "$RUNNER_TEMP/attestations.json"
          i=0
          while IFS= read -r attestation; do
            [[ "$attestation" =~ ^sha256:[0-9a-f]{64}$ ]]
            docker buildx imagetools inspect --raw "$IMAGE@$attestation" > "$RUNNER_TEMP/attestation-$i.json"
            jq -e --arg manifest "$manifest" '.subject == null or .subject.digest == $manifest' \
              "$RUNNER_TEMP/attestation-$i.json" > /dev/null
            i=$((i + 1))
          done < <(jq -r '.[]' "$RUNNER_TEMP/attestations.json")
          jq -es '
            [.[].layers[]?.annotations["in-toto.io/predicate-type"]] as $p
            | (any($p[]; . == "https://spdx.dev/Document"))
              and (any($p[]; . == "https://slsa.dev/provenance/v0.2" or . == "https://slsa.dev/provenance/v1"))
          ' "$RUNNER_TEMP"/attestation-*.json > /dev/null
          jq -n --arg arch "$ARCH" --arg index "$INDEX_DIGEST" --arg manifest "$manifest" \
            --slurpfile attestations "$RUNNER_TEMP/attestations.json" \
            '{arch:$arch,index:$index,manifest:$manifest,attestations:$attestations[0]}' > "$RUNNER_TEMP/validated.json"
          printf 'manifest=%s\n' "$manifest" >> "$GITHUB_OUTPUT"
      - name: Pull and scan the exact platform manifest
        shell: bash
        env:
          MANIFEST: ${{ steps.manifests.outputs.manifest }}
        run: |
          set -euo pipefail
          docker pull "$IMAGE@$MANIFEST"
          docker image tag "$IMAGE@$MANIFEST" pixstride:check
          docker save pixstride:check -o "$RUNNER_TEMP/pixstride.tar"
          chmod 0444 "$RUNNER_TEMP/pixstride.tar"
          docker run --rm --cap-drop=ALL --security-opt=no-new-privileges --memory=1g --pids-limit=64 \
            -v "$RUNNER_TEMP/pixstride.tar:/image.tar:ro" \
            aquasec/trivy:0.76.2@sha256:8f6bb947dbc528902e11f2f5be52f7b519f6a39d5d148f41166f2040499768fb \
            image --input /image.tar --scanners vuln,secret --severity HIGH,CRITICAL --exit-code 1 --no-progress
      - name: Verify native runtime restrictions on the exact image
        run: python3 scripts/container_check.py --image pixstride:check
      - name: Exercise the exact platform image
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/images"
          printf '%s' '<svg width="64" height="48"><rect width="64" height="48" fill="#247ac0"/></svg>' > "$RUNNER_TEMP/images/sample.svg"
          docker run -d --name pixstride-check --network=none --read-only --cap-drop=ALL \
            --security-opt=no-new-privileges --memory=512m --pids-limit=64 --cpus=2 \
            -v "$RUNNER_TEMP/images:/images:ro" -e PIXSTRIDE_ALLOW_UNSAFE=1 \
            -e PIXSTRIDE_LOCAL_ROOT=/images -e PIXSTRIDE_ALLOWED_HOSTS=127.0.0.1 pixstride:check
          trap 'docker rm -f pixstride-check >/dev/null 2>&1 || true' EXIT
          ready=0
          for attempt in {1..30}; do
            if docker exec pixstride-check pixstride healthcheck; then ready=1; break; fi
            sleep 1
          done
          test "$ready" = 1
          docker exec pixstride-check /bin/busybox wget -q -O - \
            'http://127.0.0.1:8080/unsafe/rs:fit:32:24/plain/local:///sample.svg@png' > "$RUNNER_TEMP/output.png"
          python3 - "$RUNNER_TEMP/output.png" <<'PY'
          import struct, sys
          data = open(sys.argv[1], 'rb').read()
          assert data[:8] == b'\x89PNG\r\n\x1a\n'
          assert struct.unpack('>II', data[16:24]) == (32, 24)
          PY
          response=$(docker exec pixstride-check /bin/busybox sh -c "printf 'GET /unsafe/plain/http://127.0.0.1/image.png@png HTTP/1.1\\r\\nHost: localhost:8080\\r\\n\\r\\n' | nc -w 2 127.0.0.1 8080")
          [[ "$response" == 'HTTP/1.1 502 '* ]]
          if docker run --rm --network=none --read-only --cap-drop=ALL --security-opt=no-new-privileges --memory=128m --pids-limit=32 pixstride:check; then exit 1; fi
      - name: Retain the validated immutable references
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: validated-${{ matrix.arch }}
          path: ${{ runner.temp }}/validated.json
          if-no-files-found: error
          retention-days: 7

  publish:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [build-and-verify, native-platforms]
    concurrency:
      group: pixstride-release-promotion
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      packages: write
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          version: v0.38.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: validated-amd64
          path: ${{ runner.temp }}/validated-amd64
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: validated-arm64
          path: ${{ runner.temp }}/validated-arm64
      - name: Assemble, verify and promote validated manifests
        shell: bash
        env:
          RELEASE_REF: ${{ github.ref_name }}
          RELEASE_SHA: ${{ github.sha }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          python3 scripts/project.py check --release-tag "$RELEASE_REF"
          gh api --paginate "repos/$GITHUB_REPOSITORY/releases" --jq '.[].tag_name' > "$RUNNER_TEMP/published-tags.txt"
          python3 scripts/project.py plan "$RELEASE_REF" "$RUNNER_TEMP/published-tags.txt" > "$RUNNER_TEMP/plan.json"
          version=$(jq -r '.version' "$RUNNER_TEMP/plan.json")
          channel=$(jq -r '.channel' "$RUNNER_TEMP/plan.json")
          # A missing tag is acceptable; authentication and network failures are not.
          inspect_tag() {
            if docker buildx imagetools inspect --raw "$IMAGE:$1" > "$RUNNER_TEMP/existing.json" 2> "$RUNNER_TEMP/inspect.err"; then
              return 0
            fi
            if grep -Fxq "ERROR: $IMAGE:$1: not found" "$RUNNER_TEMP/inspect.err"; then return 1; fi
            cat "$RUNNER_TEMP/inspect.err" >&2
            exit 1
          }
          if inspect_tag "$channel"; then
            current=$(jq -r '.annotations["org.opencontainers.image.version"] // empty' "$RUNNER_TEMP/existing.json")
            if test -z "$current"; then
              # Bootstrap from the legacy stable index, only if its bytes match 0.1.1.
              test "$channel" = latest
              cp "$RUNNER_TEMP/existing.json" "$RUNNER_TEMP/legacy.json"
              inspect_tag 0.1.1
              cmp "$RUNNER_TEMP/legacy.json" "$RUNNER_TEMP/existing.json"
              current=0.1.1
            fi
            python3 scripts/project.py plan "$RELEASE_REF" "$RUNNER_TEMP/published-tags.txt" \
              --channel-version "$current" > "$RUNNER_TEMP/plan.json"
          fi
          amd="$RUNNER_TEMP/validated-amd64/validated.json"
          arm="$RUNNER_TEMP/validated-arm64/validated.json"
          for arch in amd64 arm64; do
            file="$RUNNER_TEMP/validated-$arch/validated.json"
            jq -e --arg arch "$arch" '
              .arch == $arch and (.index | test("^sha256:[0-9a-f]{64}$"))
              and (.manifest | test("^sha256:[0-9a-f]{64}$"))
              and (.attestations | length > 0 and all(.[]; test("^sha256:[0-9a-f]{64}$")))
            ' "$file" > /dev/null
          done
          amd_index=$(jq -r '.index' "$amd")
          arm_index=$(jq -r '.index' "$arm")
          candidate="$IMAGE:candidate-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          docker buildx imagetools create --metadata-file "$RUNNER_TEMP/merged-meta.json" \
            --annotation "index:org.opencontainers.image.version=$version" \
            --annotation "index:org.opencontainers.image.revision=$RELEASE_SHA" \
            -t "$candidate" "$IMAGE@$amd_index" "$IMAGE@$arm_index"
          merged=$(jq -er '."containerimage.descriptor".digest' "$RUNNER_TEMP/merged-meta.json")
          [[ "$merged" =~ ^sha256:[0-9a-f]{64}$ ]]
          docker buildx imagetools inspect --raw "$IMAGE@$merged" > "$RUNNER_TEMP/merged.json"
          jq -e --slurpfile a "$amd" --slurpfile b "$arm" '
            . as $merged | [$a[0], $b[0]] as $expected
            | [$merged.manifests[] | select(.annotations["vnd.docker.reference.type"] != "attestation-manifest")] as $images
            | ($images | length == 2)
              and (($merged.manifests | length) == (2 + ([$expected[].attestations | length] | add)))
              and all($expected[]; . as $e |
                any($images[]; .digest == $e.manifest and .platform.os == "linux" and .platform.architecture == $e.arch)
                and all($e.attestations[]; . as $att |
                  any($merged.manifests[]; .digest == $att
                    and .annotations["vnd.docker.reference.type"] == "attestation-manifest"
                    and .annotations["vnd.docker.reference.digest"] == $e.manifest)))
          ' "$RUNNER_TEMP/merged.json" > /dev/null
          # Never overwrite immutable version/SHA tags with different bytes.
          tags=("$version" "sha-$RELEASE_SHA")
          for tag in "${tags[@]}"; do
            if inspect_tag "$tag"; then
              actual="sha256:$(sha256sum "$RUNNER_TEMP/existing.json" | cut -d' ' -f1)"
              test "$actual" = "$merged"
            fi
          done
          if test "$(jq -r '.move_channel' "$RUNNER_TEMP/plan.json")" = true; then tags+=("$channel"); fi
          args=()
          for tag in "${tags[@]}"; do args+=(-t "$IMAGE:$tag"); done
          docker buildx imagetools create --metadata-file "$RUNNER_TEMP/published-meta.json" \
            "${args[@]}" "$IMAGE@$merged"
          published=$(jq -er '."containerimage.descriptor".digest' "$RUNNER_TEMP/published-meta.json")
          test "$published" = "$merged"
          for tag in "${tags[@]}"; do
            actual="sha256:$(docker buildx imagetools inspect --raw "$IMAGE:$tag" | sha256sum | cut -d' ' -f1)"
            test "$actual" = "$merged"
          done
          printf 'Published verified index: %s@%s\n' "$IMAGE" "$merged"
          python3 scripts/project.py notes "$version" > "$RUNNER_TEMP/release-notes.md"
          printf '\nVerified container: `%s@%s`\n' "$IMAGE" "$merged" >> "$RUNNER_TEMP/release-notes.md"
          release_args=(--verify-tag --title "Pixstride $version" --notes-file "$RUNNER_TEMP/release-notes.md")
          if test "$(jq -r '.prerelease' "$RUNNER_TEMP/plan.json")" = true; then
            release_args+=(--prerelease --latest=false)
          elif test "$(jq -r '.move_channel' "$RUNNER_TEMP/plan.json")" = true; then
            release_args+=(--latest)
          else
            release_args+=(--latest=false)
          fi
          gh release create "$RELEASE_REF" "${release_args[@]}"
