name: Benchmarks
on:
  workflow_dispatch:
  push:
    branches: [codex/reusable-linux-benchmarks, 'codex/benchmark-release-*']
    paths:
      - .github/workflows/benchmark.yml
      - scripts/benchmark.py
      - scripts/benchmark_runtime.py
      - scripts/benchmark_metrics.py
      - scripts/benchmark_fixtures.py
      - scripts/benchmark_release.py
      - .github/checks/project/test_benchmark_runtime.py
      - .github/checks/project/test_benchmark_runner.py
      - .github/checks/project/test_benchmark_metrics.py
      - .github/checks/project/test_benchmark_fixtures.py
      - .github/checks/project/test_benchmark_release.py
      - benchmarks/cases.json
      - benchmarks/released-versions.json
permissions:
  contents: read
concurrency:
  group: benchmarks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  corpus:
    name: Shared corpus and accounting tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install decoder, test accounting and prepare identical inputs
        run: |
          python3 -m venv "$RUNNER_TEMP/benchmark-env"
          "$RUNNER_TEMP/benchmark-env/bin/python" -m pip install --disable-pip-version-check --only-binary=:all: Pillow==13.0.0
          "$RUNNER_TEMP/benchmark-env/bin/python" -m unittest discover -s .github/checks/project -v
          "$RUNNER_TEMP/benchmark-env/bin/python" scripts/project.py check
          "$RUNNER_TEMP/benchmark-env/bin/python" scripts/candidate_snapshot.py --check
          "$RUNNER_TEMP/benchmark-env/bin/python" scripts/benchmark_fixtures.py --output "$RUNNER_TEMP/corpus" --cache "$RUNNER_TEMP/source-cache"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: benchmark-shared-corpus
          path: ${{ runner.temp }}/corpus/
          if-no-files-found: error
          retention-days: 7
  measure:
    name: Released ${{ matrix.platform.arch }} repetition ${{ matrix.repetition }}
    needs: corpus
    strategy:
      fail-fast: false
      matrix:
        platform:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
        repetition: [1, 2, 3]
    runs-on: ${{ matrix.platform.runner }}
    timeout-minutes: 60
    env:
      BENCHMARK_RUNNER: ${{ matrix.platform.runner }}
      BENCHMARK_ARCH: ${{ matrix.platform.arch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: benchmark-shared-corpus
          path: ${{ runner.temp }}/corpus
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
        with:
          version: v0.38.1
          driver: docker
      - name: Install pinned independent decoder
        run: |
          python3 -m venv "$RUNNER_TEMP/benchmark-env"
          "$RUNNER_TEMP/benchmark-env/bin/python" -m pip install --disable-pip-version-check --only-binary=:all: Pillow==13.0.0
      - name: Preflight every case using only pinned published images
        run: |
          "$RUNNER_TEMP/benchmark-env/bin/python" scripts/benchmark.py --architecture "$BENCHMARK_ARCH" --versions benchmarks/released-versions.json --fixtures "$RUNNER_TEMP/corpus" --output "$RUNNER_TEMP/preflight.json" --preflight
      - name: Measure all cases with the unchanged balanced protocol
        run: |
          "$RUNNER_TEMP/benchmark-env/bin/python" scripts/benchmark.py --architecture "$BENCHMARK_ARCH" --versions benchmarks/released-versions.json --fixtures "$RUNNER_TEMP/corpus" --output "$RUNNER_TEMP/report.json"
      - name: Verify owned containers were cleaned
        if: always()
        run: test -z "$(docker ps -aq --filter label=io.pixstride.benchmark.run)"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: benchmark-linux-${{ matrix.platform.arch }}-${{ matrix.repetition }}
          path: |
            ${{ runner.temp }}/report.json
            ${{ runner.temp }}/preflight.json
          if-no-files-found: warn
          retention-days: 90
  qualification:
    name: Recompute every released-image comparison
    needs: measure
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          pattern: benchmark-linux-*
          path: ${{ runner.temp }}/reports
      - name: Require all metrics and pixel gates in all six retained runs
        run: |
          python3 scripts/release_snapshot.py --qualify "$RUNNER_TEMP"/reports/benchmark-linux-*/report.json --output "$RUNNER_TEMP/qualification.json" --markdown "$RUNNER_TEMP/qualification.md"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: benchmark-release-qualification
          path: |
            ${{ runner.temp }}/qualification.json
            ${{ runner.temp }}/qualification.md
          if-no-files-found: warn
          retention-days: 90
