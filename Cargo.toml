[package]
name = "pixstride"
version = "0.1.1"
edition = "2021"
rust-version = "1.99"
license = "MIT"
description = "A bounded image transformation server written in Rust"
repository = "https://github.com/lansbe/pixstride"
publish = false

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
overflow-checks = true

[dependencies]
bytes = { version = "1.12.0", optional = true }
color_quant = { version = "1.1.0", optional = true }
cookie_store = { version = "0.22.1", default-features = false, optional = true }
dotenvy = { version = "0.15.7", optional = true }
futures-util = { version = "0.3.34", optional = true }
gif = { version = "0.14.2", optional = true }
http = { version = "1.5.0", optional = true }
httpdate = "1.0.3"
libc = "0.2.191"
libvips = { version = "=0.7.0", package = "rs-vips", optional = true }
opendal = { version = "=0.59.5", default-features = false, features = ["services-s3", "services-gcs", "services-azblob", "services-swift", "executors-tokio"], optional = true }
openssl = { version = "0.10.82", optional = true }
psl = { version = "2.1.253", optional = true }
regex = { version = "1.13.1", default-features = false, features = ["std", "perf", "unicode"] }
reqsign-aws-v4 = { version = "3.3.1", optional = true }
reqsign-core = { version = "3.3.2", optional = true }
reqsign-google = { version = "3.2.0", optional = true }
reqwest = { version = "0.13", default-features = false, features = ["native-tls", "stream"], optional = true }
roxmltree = { version = "0.21.2", optional = true }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt", "time"], optional = true }
url = { version = "2.5.8", optional = true }

[features]
native-codecs = ["dep:libvips", "dep:color_quant", "dep:gif", "dep:roxmltree"]
cloud-sources = ["dep:opendal", "dep:tokio", "dep:reqwest", "dep:http", "dep:futures-util", "dep:bytes", "dep:reqsign-core", "dep:reqsign-aws-v4"]
telemetry = ["dep:reqwest", "dep:tokio"]
source-cookies = ["dep:cookie_store", "dep:psl", "dep:url"]
cloud-config = ["cloud-sources", "dep:reqsign-google", "dep:dotenvy"]
s3-decryption = ["cloud-config", "dep:openssl"]

[patch.crates-io]
rs-vips = { path = "vendor/rs-vips" }
