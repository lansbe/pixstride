[package]
name = "pixstride"
version = "0.1.0"
edition = "2021"
rust-version = "1.99"
license = "MIT"
description = "A bounded image transformation server written in Rust"
repository = "https://github.com/lansbe/pixstride"
publish = false

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
overflow-checks = true
